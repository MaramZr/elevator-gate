{% extends "base.html" %}

{% block title %}
    FAQ | Elevator Gate
{% endblock %}

{% block content %}

    <section>
        <h1>Frequently Asked Questions</h1>

        {% for faq in faqs %}
            <div>
                <h3>{{ faq.question }}</h3>
                <p>{{ faq.answer }}</p>
            </div>
        {% empty %}
            <p>No FAQs available.</p>
        {% endfor %}
    </section>

{% endblock %}
